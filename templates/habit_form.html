<div class="modal-header drag-handle">
    <span class="modal-title">{% if object %}Edit Habit{% else %}New Habit{% endif %}</span>
    <button type="button" class="modal-close" onclick="closeHabitModal()">&times;</button>
</div>
<div class="modal-body">
    <form method="post"
          class="habit-modal-form"
          hx-post="{{ request.path }}?view={{ view }}&week_change={{ week_change }}"
          hx-target="#habitModalContent"
          hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="view" value="{{ view }}">
        <input type="hidden" name="week_change" value="{{ week_change }}">
        <div class="modal-field">
            <label>Name:</label>
            {{ form.name }}
        </div>
        <div class="modal-field">
            <label>Description:</label>
            {{ form.description }}
        </div>
        <div class="modal-field modal-field-checkbox">
            <label class="modal-check-row">
                {{ form.status }}
                <span>Active</span>
            </label>
        </div>
        <div class="modal-actions">
            <button type="submit" class="habit-btn">Save</button>
            <button type="button" class="habit-btn" onclick="closeHabitModal()">Cancel</button>
        </div>
    </form>
    {% if object %}
        <form method="post"
              class="habit-delete-form"
              hx-post="{% url 'habit-delete' object.id %}?view={{ view }}&week_change={{ week_change }}"
              hx-target="#habitModalContent"
              hx-swap="innerHTML"
              onsubmit="return confirm('Delete this habit and all its data?')">
            {% csrf_token %}
            <input type="hidden" name="view" value="{{ view }}">
            <input type="hidden" name="week_change" value="{{ week_change }}">
            <button type="submit" class="habit-btn danger">Delete</button>
        </form>
    {% endif %}
</div>
