{% extends 'base.html' %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css">
<style>
    #sleep-slider { margin: 40px 0; height: 10px; }
    .noUi-connect { background: #0d6efd; }
    .noUi-handle { border-radius: 50%; cursor: grab; }
</style>
<h2>Edit your sleep for {{ object.date|date:"F d" }}</h2>

    <div>
    <span>Time Interval</span>
    <h2 id="time-range-display" class="fw-bold text-primary">--:-- — --:--</h2>
    </div>
    <div id="sleep-slider"></div>
<form id="sleepForm" method="post">
    {% csrf_token %}
    <input type="hidden" name="bedtime" id="id_bedtime">
    <input type="hidden" name="waketime" id="id_waketime">
    <div>
        <label class="form-label d-flex justify-content-between">
            Sleep Quality: <span id="q_val">{{ object.quality }}</span>
        </label>
        <input type="range" name="quality" class="form-range" min="1" max="10"
               value="{{ object.quality }}" id="quality_range">
    </div>

    <div>
        <label for="id_comment" class="form-label">Comment:</label>
        <textarea name="comment" id="id_comment" class="form-control">{{ object.comment|default_if_none:'' }}</textarea>
    </div>

    <button type="submit">Save</button>
    <a href="{% url 'sleep-page' %}">Cancel</a>

</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
<script>
const slider = document.getElementById('sleep-slider');
function timeToMinutes(timeStr) {
    let [h, m] = timeStr.split(':').map(Number);
    let total = h * 60 + m;
    return (h < 18) ? total + 1440 : total;
}
function minutesToTime(totalMinutes) {
    let h = Math.floor(totalMinutes / 60) % 24;
    let m = totalMinutes % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

let initialBed = timeToMinutes("{{ object.bedtime|date:'H:i' }}");
let initialWake = timeToMinutes("{{ object.waketime|date:'H:i' }}");
noUiSlider.create(slider, {
    start: [initialBed, initialWake],
    connect: true,
    step: 5,
    range: { 'min': 1080, 'max': 2160 }
});
document.getElementById('id_bedtime').value = minutesToTime(initialBed);
document.getElementById('id_waketime').value = minutesToTime(initialWake);

slider.noUiSlider.on('update', function(values) {
    let bTime = minutesToTime(Math.round(values[0]));
    let wTime = minutesToTime(Math.round(values[1]));

    document.getElementById('time-range-display').innerText = `${bTime} — ${wTime}`;
    document.getElementById('id_bedtime').value = bTime;
    document.getElementById('id_waketime').value = wTime;
});

slider.noUiSlider.set([initialBed, initialWake]);

document.getElementById('quality_range').addEventListener('input', (e) => {
    document.getElementById('q_val').innerText = e.target.value;
});
</script>
{% endblock %}
