{% load static %}
<!DOCTYPE html>
<html lang="en">
{% load pwa %}
{% progressive_web_app_meta %}
<link rel="manifest" href="manifest.json">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Habits and Sleep{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'styles/styles.css' %}?v=2.12">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"
            crossorigin="anonymous"
            integrity="sha512-UOJe4paV6hYWBnS0c9GnIRH8PLm2nFK22uhfAvsTIqd3uwnWsVri1OPn5fJYdLtGY3wB11LGHJ4yPU1WFJeBYQ=="></script>
    <script src="https://unpkg.com/htmx.org@2.0.10"
            integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
            crossorigin="anonymous"></script>
</head>
<body>

{% if user.is_authenticated %}
<header class="header">
    <button class="menu-btn" type="button" onclick="toggleSidebar()" aria-label="Open menu">
        &#9776;
    </button>
</header>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <span></span>
        <button type="button" onclick="toggleSidebar()" aria-label="Close menu">✕</button>
    </div>

    <nav class="nav" aria-label="Navigation">
        <a href="{% url 'home' %}" class="nav-item">🏠 Home</a>
        <a href="{% url 'habits-page' %}" class="nav-item">✅ Habits</a>
        <a href="{% url 'sleep-page' %}" class="nav-item">🌙 Sleep</a>
        <a href="{% url 'report-page' %}" class="nav-item">📊 Analytics</a>
        <a href="{% url 'edit-profile' %}" class="nav-item">👤 Profile</a>
        <form method="post" action="{% url 'logout' %}" class="nav-item logout-link">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </nav>
</div>

<div id="overlay"
     class="overlay"
     onclick="toggleSidebar()"
     onkeydown="if(event.key === 'Enter' || event.key === ' ') toggleSidebar()"
     role="button"></div>
{% else %}
<header class="header">
    <nav class="auth-links" aria-label="Authentication">
        <a href="{% url 'login' %}">Login</a>
        <span>|</span>
        <a href="{% url 'register' %}">Register</a>
    </nav>
</header>
{% endif %}

<main class="content">
    {% block content %}{% endblock %}
</main>
<footer class="footer"></footer>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }
</script>

</body>
</html>
